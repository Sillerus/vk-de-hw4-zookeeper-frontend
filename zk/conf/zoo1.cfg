# Сервер 1 ансамбля ZooKeeper (три копии на одной машине)
tickTime=2000
initLimit=10
syncLimit=5
# у каждой копии своя папка данных и свои порты
dataDir=/opt/hw4-zk/zk1/data
clientPort=2181
admin.serverPort=8081
4lw.commands.whitelist=srvr,stat,ruok,mntr
# строки участников одинаковые во всех трёх конфигурациях
# server.N=host:порт_синхронизации_с_лидером:порт_выборов
server.1=127.0.0.1:2888:3888
server.2=127.0.0.1:2889:3889
server.3=127.0.0.1:2890:3890
